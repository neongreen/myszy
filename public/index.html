<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b1640" />
    <title>Котики ловят мышей</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div id="sky" aria-hidden="true"></div>
      <div id="field"></div>
      <header id="hud">
        <div class="stat"><span class="label">Очки</span><span id="score">0</span></div>
        <div class="stat"><span class="label">Время</span><span id="time">60</span></div>
      </header>

      <section id="start" class="screen">
        <div class="card">
          <h1>Котики ловят мышей</h1>
          <p class="lead">Нажимай на падающих мышек — чёрная кошачья лапка их поймает.</p>
          <ul class="legend">
            <li><span class="icon" data-legend="mouse"></span><span>Мышка в шляпе ведьмы</span><b class="good">+1</b></li>
            <li><span class="icon" data-legend="rainbowMouse"></span><span>Радужная мышка</span><b class="big">+5</b></li>
            <li><span class="icon" data-legend="rainbowHat"></span><span>Радужная шляпа</span><b class="big">+5</b></li>
            <li><span class="icon" data-legend="bomb"></span><span>Бомба</span><b class="bad">−1</b></li>
            <li><span class="icon" data-legend="cheese"></span><span>Чёрный сыр — проигрыш, все очки сгорают</span><b class="bad">0</b></li>
          </ul>
          <button type="button" class="play" data-start>Играть</button>
        </div>
      </section>

      <section id="end" class="screen" hidden>
        <div class="card">
          <h2 id="end-title"></h2>
          <p id="end-text" class="lead"></p>
          <p id="end-best"></p>
          <button type="button" class="play" data-start>Ещё раз</button>
        </div>
      </section>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
